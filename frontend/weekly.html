<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Semaine — Muscu</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Barlow', sans-serif; background: #030712; touch-action: manipulation; }
    .heading { font-family: 'Barlow Condensed', sans-serif; letter-spacing: 0.04em; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
    }
  </style>
</head>
<body class="min-h-screen text-gray-100 pb-24">

  <header class="px-4 pt-8 pb-4 flex items-start justify-between">
    <div>
      <h1 class="text-3xl font-bold text-orange-500 uppercase heading">Cette semaine</h1>
      <p class="text-gray-400 text-sm" id="weekRange"></p>
    </div>
    <button id="refreshBtn"
      class="mt-1 text-gray-400 hover:text-orange-400 transition-colors duration-200 cursor-pointer"
      aria-label="Actualiser">
      <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99" />
      </svg>
    </button>
  </header>

  <main class="px-4 space-y-5">

    <div id="loading" class="text-center py-12">
      <div class="inline-block w-8 h-8 border-2 border-orange-500 border-t-transparent rounded-full animate-spin"></div>
      <p class="text-gray-400 mt-3 text-sm">Demande à Claude…</p>
    </div>

    <div id="aiUnavailable" class="hidden bg-gray-800 border border-yellow-500/30 rounded-xl px-4 py-3 text-sm text-yellow-300">
      Suggestions IA disponibles au Sprint 5 — les séances de la semaine sont affichées ci-dessous.
    </div>

    <div id="errorState" class="hidden bg-gray-800 border border-red-500/30 rounded-xl px-4 py-3 text-sm text-red-300"></div>

    <!-- Résumé Claude -->
    <div id="summarySection" class="hidden">
      <div class="bg-gray-800 border border-orange-500/30 rounded-xl p-4">
        <p class="text-xs uppercase tracking-widest text-orange-400 mb-2 font-semibold">Résumé</p>
        <p id="summaryText" class="text-gray-200 leading-relaxed"></p>
      </div>
    </div>

    <!-- Suggestions Claude -->
    <div id="suggestionsSection" class="hidden">
      <p class="text-xs uppercase tracking-widest text-gray-400 mb-2 font-semibold">Suggestions</p>
      <div id="suggestionsList" class="space-y-3"></div>
    </div>

    <!-- Focus semaine prochaine -->
    <div id="nextWeekSection" class="hidden">
      <div class="bg-gray-800 border border-green-500/30 rounded-xl p-4">
        <p class="text-xs uppercase tracking-widest text-green-400 mb-2 font-semibold">Semaine prochaine</p>
        <p id="nextWeekText" class="text-gray-200 leading-relaxed"></p>
      </div>
    </div>

    <!-- Séances de la semaine -->
    <div id="sessionsSection" class="hidden">
      <p class="text-xs uppercase tracking-widest text-gray-400 mb-2 font-semibold">Séances de la semaine</p>
      <div id="sessionsList" class="space-y-2"></div>
    </div>

    <div id="noSessionsState" class="hidden text-center py-6">
      <p class="text-gray-500">Aucune séance cette semaine</p>
    </div>

  </main>

  <nav class="fixed bottom-0 left-0 right-0 bg-gray-900 border-t border-gray-800 z-50">
    <div class="grid grid-cols-4 h-16">
      <a href="index.html" class="flex flex-col items-center justify-center gap-1 text-xs font-semibold text-gray-500 hover:text-gray-300 transition-colors cursor-pointer">
        <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931Zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0 1 15.75 21H5.25A2.25 2.25 0 0 1 3 18.75V8.25A2.25 2.25 0 0 1 5.25 6H10"/></svg>
        Séance
      </a>
      <a href="exercises.html" class="flex flex-col items-center justify-center gap-1 text-xs font-semibold text-gray-500 hover:text-gray-300 transition-colors cursor-pointer">
        <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M8.25 6.75h12M8.25 12h12m-12 5.25h12M3.75 6.75h.007v.008H3.75V6.75Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0ZM3.75 12h.007v.008H3.75V12Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm-.375 5.25h.007v.008H3.75v-.008Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z"/></svg>
        Exercices
      </a>
      <a href="history.html" class="flex flex-col items-center justify-center gap-1 text-xs font-semibold text-gray-500 hover:text-gray-300 transition-colors cursor-pointer">
        <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 0 1 3 19.875v-6.75ZM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V8.625ZM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V4.125Z"/></svg>
        Historique
      </a>
      <a href="weekly.html" class="flex flex-col items-center justify-center gap-1 text-xs font-semibold text-orange-500 cursor-pointer" aria-current="page">
        <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75m-18 0v-7.5A2.25 2.25 0 0 1 5.25 9h13.5A2.25 2.25 0 0 1 21 9v7.5m-9-6h.008v.008H12V9Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0ZM12 12h.008v.008H12V12Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0ZM9.75 12h.008v.008H9.75V12Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z"/></svg>
        Semaine
      </a>
    </div>
  </nav>

  <script src="app.js"></script>
  <script>
    function getWeekLabel() {
      const today = new Date();
      const day = today.getDay();
      const monday = new Date(today);
      monday.setDate(today.getDate() - (day === 0 ? 6 : day - 1));
      const sunday = new Date(monday);
      sunday.setDate(monday.getDate() + 6);
      const fmt = d => d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' });
      return `${fmt(monday)} → ${fmt(sunday)}`;
    }

    function hideAll() {
      ['loading', 'aiUnavailable', 'errorState', 'summarySection',
       'suggestionsSection', 'nextWeekSection', 'sessionsSection', 'noSessionsState']
        .forEach(id => document.getElementById(id).classList.add('hidden'));
    }

    async function loadWeekly() {
      hideAll();
      document.getElementById('loading').classList.remove('hidden');

      try {
        const data = await api.getWeeklySummary();
        hideAll();

        // Séances
        if (data.sessions && data.sessions.length) {
          document.getElementById('sessionsList').innerHTML = data.sessions.map(s => `
            <div class="bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 flex justify-between items-center">
              <div>
                <p class="text-gray-100 font-semibold text-sm">${escapeHtml(s.exercise_name)}</p>
                <p class="text-gray-500 text-xs">${escapeHtml(s.date)}</p>
              </div>
              <span class="text-orange-400 font-semibold text-sm">${s.sets}×${s.reps} @ ${s.weight_kg} kg</span>
            </div>
          `).join('');
          document.getElementById('sessionsSection').classList.remove('hidden');
        } else {
          document.getElementById('noSessionsState').classList.remove('hidden');
        }

        // Suggestions Claude (null si Sprint 5 pas fait)
        const sg = data.suggestions;
        if (!sg) {
          document.getElementById('aiUnavailable').classList.remove('hidden');
          return;
        }
        if (sg.summary) {
          document.getElementById('summaryText').textContent = sg.summary;
          document.getElementById('summarySection').classList.remove('hidden');
        }
        if (sg.suggestions && sg.suggestions.length) {
          document.getElementById('suggestionsList').innerHTML = sg.suggestions.map(s => `
            <div class="bg-gray-800 border border-gray-700 rounded-xl p-4">
              <p class="text-orange-400 font-semibold text-sm uppercase heading">${escapeHtml(s.exercise)}</p>
              <p class="text-gray-400 text-xs mt-0.5">Actuel : ${escapeHtml(s.current)}</p>
              <p class="text-gray-200 text-sm mt-1">${escapeHtml(s.recommendation)}</p>
            </div>
          `).join('');
          document.getElementById('suggestionsSection').classList.remove('hidden');
        }
        if (sg.next_week_focus) {
          document.getElementById('nextWeekText').textContent = sg.next_week_focus;
          document.getElementById('nextWeekSection').classList.remove('hidden');
        }

      } catch (e) {
        hideAll();
        document.getElementById('errorState').textContent = e.message;
        document.getElementById('errorState').classList.remove('hidden');
      }
    }

    document.getElementById('weekRange').textContent = getWeekLabel();
    document.getElementById('refreshBtn').addEventListener('click', loadWeekly);
    loadWeekly();
  </script>
</body>
</html>
