<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Historique — Muscu</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Barlow', sans-serif; background: #030712; touch-action: manipulation; }
    .heading { font-family: 'Barlow Condensed', sans-serif; letter-spacing: 0.04em; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body class="min-h-screen text-gray-100 pb-24">

  <header class="px-4 pt-8 pb-4">
    <h1 class="text-3xl font-bold text-orange-500 uppercase heading">Historique</h1>
  </header>

  <main class="px-4 space-y-5">

    <div>
      <label for="exerciseSelect" class="block text-xs uppercase tracking-widest text-gray-400 mb-1 font-semibold">Exercice</label>
      <select id="exerciseSelect"
        class="w-full bg-gray-800 border border-gray-700 text-gray-100 text-base rounded-xl px-4 py-3 focus:outline-none focus:border-orange-500 cursor-pointer min-h-[52px]">
        <option value="">Choisir un exercice…</option>
      </select>
    </div>

    <!-- Graphe -->
    <div id="chartSection" class="hidden">
      <div class="bg-gray-800 rounded-xl p-4">
        <p class="text-xs uppercase tracking-widest text-gray-400 mb-3 font-semibold">Progression du poids (kg)</p>
        <canvas id="progressChart" role="img" aria-label="Graphe de progression du poids"></canvas>
      </div>
    </div>

    <!-- Tableau -->
    <div id="tableSection" class="hidden">
      <p class="text-xs uppercase tracking-widest text-gray-400 mb-2 font-semibold">Séances</p>
      <div id="sessionTable" class="space-y-2"></div>
    </div>

    <!-- État vide -->
    <div id="emptyState" class="hidden text-center py-10">
      <p class="text-gray-500">Aucune séance enregistrée pour cet exercice</p>
    </div>

  </main>

  <nav class="fixed bottom-0 left-0 right-0 bg-gray-900 border-t border-gray-800 z-50">
    <div class="grid grid-cols-4 h-16">
      <a href="index.html" class="flex flex-col items-center justify-center gap-1 text-xs font-semibold text-gray-500 hover:text-gray-300 transition-colors cursor-pointer">
        <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931Zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0 1 15.75 21H5.25A2.25 2.25 0 0 1 3 18.75V8.25A2.25 2.25 0 0 1 5.25 6H10"/></svg>
        Séance
      </a>
      <a href="exercises.html" class="flex flex-col items-center justify-center gap-1 text-xs font-semibold text-gray-500 hover:text-gray-300 transition-colors cursor-pointer">
        <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M8.25 6.75h12M8.25 12h12m-12 5.25h12M3.75 6.75h.007v.008H3.75V6.75Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0ZM3.75 12h.007v.008H3.75V12Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm-.375 5.25h.007v.008H3.75v-.008Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z"/></svg>
        Exercices
      </a>
      <a href="history.html" class="flex flex-col items-center justify-center gap-1 text-xs font-semibold text-orange-500 cursor-pointer" aria-current="page">
        <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 0 1 3 19.875v-6.75ZM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V8.625ZM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V4.125Z"/></svg>
        Historique
      </a>
      <a href="weekly.html" class="flex flex-col items-center justify-center gap-1 text-xs font-semibold text-gray-500 hover:text-gray-300 transition-colors cursor-pointer">
        <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75m-18 0v-7.5A2.25 2.25 0 0 1 5.25 9h13.5A2.25 2.25 0 0 1 21 9v7.5m-9-6h.008v.008H12V9Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0ZM12 12h.008v.008H12V12Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0ZM9.75 12h.008v.008H9.75V12Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z"/></svg>
        Semaine
      </a>
    </div>
  </nav>

  <script src="app.js"></script>
  <script>
    let chart = null;

    api.getExercises().then(exercises => {
      const sel = document.getElementById('exerciseSelect');
      exercises.forEach(ex => {
        const opt = document.createElement('option');
        opt.value = ex.name;
        opt.textContent = ex.name;
        sel.appendChild(opt);
      });
    }).catch(() => showToast('Backend inaccessible', 'error'));

    document.getElementById('exerciseSelect').addEventListener('change', async function () {
      if (!this.value) return;
      try {
        // API retourne du plus récent au plus ancien → on renverse pour le graphe
        const newest = await api.getHistory(this.value);
        const chronological = newest.slice().reverse();
        renderHistory(chronological, newest);
      } catch {
        document.getElementById('chartSection').classList.add('hidden');
        document.getElementById('tableSection').classList.add('hidden');
        document.getElementById('emptyState').classList.remove('hidden');
      }
    });

    function renderHistory(chronological, newest) {
      if (!chronological.length) {
        document.getElementById('chartSection').classList.add('hidden');
        document.getElementById('tableSection').classList.add('hidden');
        document.getElementById('emptyState').classList.remove('hidden');
        return;
      }

      document.getElementById('emptyState').classList.add('hidden');
      document.getElementById('chartSection').classList.remove('hidden');
      document.getElementById('tableSection').classList.remove('hidden');

      if (chart) chart.destroy();
      const ctx = document.getElementById('progressChart').getContext('2d');
      chart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: chronological.map(s => s.date),
          datasets: [{
            label: 'Poids (kg)',
            data: chronological.map(s => s.weight_kg),
            borderColor: '#F97316',
            backgroundColor: 'rgba(249,115,22,0.1)',
            borderWidth: 2,
            tension: 0.3,
            pointRadius: 5,
            pointBackgroundColor: '#F97316',
            fill: true,
          }],
        },
        options: {
          responsive: true,
          plugins: { legend: { display: false } },
          scales: {
            x: { ticks: { color: '#9CA3AF', font: { family: 'Barlow' } }, grid: { color: '#1F2937' } },
            y: { ticks: { color: '#9CA3AF', font: { family: 'Barlow' } }, grid: { color: '#1F2937' } },
          },
        },
      });

      document.getElementById('sessionTable').innerHTML = newest.map(s => `
        <div class="bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 flex justify-between items-center">
          <span class="text-gray-400 text-sm">${escapeHtml(s.date)}</span>
          <span class="font-semibold text-sm">
            ${s.sets}×${s.reps} @ <span class="text-orange-400">${s.weight_kg} kg</span>
          </span>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
