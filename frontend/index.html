<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Séance — Muscu</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Barlow', sans-serif; background: #030712; }
    .heading { font-family: 'Barlow Condensed', sans-serif; letter-spacing: 0.04em; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
    }
  </style>
</head>
<body class="min-h-screen text-gray-100 pb-24">

  <header class="px-4 pt-8 pb-4">
    <h1 class="text-3xl font-bold text-orange-500 uppercase heading">Séance</h1>
    <p class="text-gray-400 text-sm" id="dateDisplay"></p>
  </header>

  <main class="px-4 space-y-5">

    <!-- Date -->
    <div>
      <label for="date" class="block text-xs uppercase tracking-widest text-gray-400 mb-1 font-semibold">Date</label>
      <input type="date" id="date"
        class="w-full bg-gray-800 border border-gray-700 text-gray-100 text-base rounded-xl px-4 py-3 focus:outline-none focus:border-orange-500 cursor-pointer min-h-[52px]">
    </div>

    <!-- Exercise selection panel -->
    <div id="exerciseSection">
      <div class="flex items-center justify-between mb-3">
        <span class="text-xs uppercase tracking-widest text-gray-400 font-semibold">Exercice</span>
        <button id="newExerciseBtn"
          class="flex items-center gap-1.5 bg-gray-800 hover:bg-gray-700 border border-gray-700 text-orange-500 text-sm font-semibold rounded-lg px-3 py-2 transition-colors">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/>
          </svg>
          Nouvel exercice
        </button>
      </div>

      <!-- Search -->
      <div class="relative mb-4">
        <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-500 pointer-events-none" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z"/>
        </svg>
        <input type="text" id="exerciseSearch" placeholder="Rechercher un exercice…"
          class="w-full bg-gray-800 border border-gray-700 text-gray-100 text-base rounded-xl pl-10 pr-4 py-3 focus:outline-none focus:border-orange-500 min-h-[52px]">
      </div>

      <!-- Exercise list -->
      <div id="exerciseList" class="space-y-5"></div>
    </div>

    <!-- Session form (hidden until exercise selected) -->
    <div id="sessionForm" class="hidden space-y-4">

      <!-- Selected exercise header -->
      <div class="flex items-center justify-between bg-gray-800 border border-gray-700 rounded-xl px-4 py-3">
        <div>
          <p class="text-xs uppercase tracking-widest text-gray-500 font-semibold mb-0.5">Exercice sélectionné</p>
          <p id="selectedExerciseName" class="text-white font-bold text-lg leading-tight"></p>
        </div>
        <button id="changeExerciseBtn"
          class="shrink-0 text-orange-500 text-sm font-semibold hover:text-orange-400 transition-colors ml-3">
          Changer
        </button>
      </div>

      <!-- Last session reference -->
      <div id="lastSession" class="hidden bg-gray-800/50 border border-gray-700 rounded-xl px-4 py-3">
        <p class="text-xs uppercase tracking-widest text-gray-500 mb-1 font-semibold">Dernière fois</p>
        <p id="lastSessionText" class="text-orange-400 text-sm font-semibold"></p>
      </div>

      <!-- Input mode selector -->
      <div id="inputModePanel" class="grid grid-cols-3 gap-2">
        <button id="dictateBtn"
          class="flex flex-col items-center justify-center gap-1.5 bg-gray-800 hover:bg-gray-700 border border-gray-700 hover:border-orange-500 rounded-xl py-4 px-2 transition-colors">
          <span class="text-2xl leading-none">🎤</span>
          <span class="text-xs font-semibold text-gray-300 text-center leading-tight">Dicter<br>les séries</span>
        </button>
        <button id="photoSessionBtn"
          class="flex flex-col items-center justify-center gap-1.5 bg-gray-800 hover:bg-gray-700 border border-gray-700 hover:border-orange-500 rounded-xl py-4 px-2 transition-colors">
          <span class="text-2xl leading-none">📷</span>
          <span class="text-xs font-semibold text-gray-300 text-center leading-tight">Photo de<br>la machine</span>
        </button>
        <button id="manualBtn"
          class="flex flex-col items-center justify-center gap-1.5 bg-gray-800 hover:bg-gray-700 border border-gray-700 hover:border-orange-500 rounded-xl py-4 px-2 transition-colors">
          <span class="text-2xl leading-none">✏️</span>
          <span class="text-xs font-semibold text-gray-300 text-center leading-tight">Saisie<br>manuelle</span>
        </button>
      </div>

      <!-- Voice panel (hidden) -->
      <div id="voicePanel" class="hidden bg-gray-800 border border-orange-500/40 rounded-xl px-4 py-5 text-center space-y-3">
        <div id="voiceStatus" class="text-orange-400 font-semibold text-lg">Écoute en cours…</div>
        <p class="text-gray-500 text-sm">Ex : "3 séries 8 reps 80 kilos"</p>
        <button id="cancelVoiceBtn" class="text-gray-400 hover:text-white text-sm font-semibold transition-colors">
          Annuler
        </button>
      </div>

      <!-- Photo capture input (hidden) -->
      <input type="file" id="photoSessionInput" accept="image/*" capture="environment" class="hidden">

      <!-- Manual series form (shown when Manuel clicked) -->
      <div id="manualPanel" class="hidden space-y-4">

        <!-- Sets list -->
        <div id="setsList" class="space-y-2"></div>

        <!-- Add set button -->
        <button id="addSetBtn"
          class="w-full bg-gray-800 hover:bg-gray-700 border border-dashed border-gray-600 hover:border-orange-500 text-gray-400 hover:text-white text-base font-semibold rounded-xl py-4 transition-colors flex items-center justify-center gap-2">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/>
          </svg>
          Ajouter une série
        </button>

        <!-- Save button -->
        <button id="submitBtn"
          class="w-full bg-orange-500 hover:bg-orange-400 text-white text-xl font-bold uppercase heading rounded-xl py-5 transition-colors duration-200 cursor-pointer min-h-[64px] disabled:opacity-60">
          Enregistrer la séance
        </button>

      </div>

    </div>

  </main>

  <!-- New exercise modal -->
  <div id="newExerciseModal" class="fixed inset-0 bg-black/75 z-50 items-end sm:items-center justify-center p-4" style="display:none">
    <div class="bg-gray-900 border border-gray-700 rounded-2xl w-full max-w-md p-5 space-y-4">
      <div class="flex items-center justify-between">
        <h2 class="text-xl font-bold uppercase heading text-orange-500">Nouvel exercice</h2>
        <button id="closeModalBtn" class="text-gray-500 hover:text-gray-300 p-1">
          <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>

      <div>
        <label class="block text-xs uppercase tracking-widest text-gray-400 mb-1 font-semibold">Nom *</label>
        <input type="text" id="newExName" placeholder="Ex : Développé couché"
          class="w-full bg-gray-800 border border-gray-700 text-gray-100 text-base rounded-xl px-4 py-3 focus:outline-none focus:border-orange-500">
      </div>

      <div>
        <label class="block text-xs uppercase tracking-widest text-gray-400 mb-1 font-semibold">Description</label>
        <input type="text" id="newExDesc" placeholder="Optionnel"
          class="w-full bg-gray-800 border border-gray-700 text-gray-100 text-base rounded-xl px-4 py-3 focus:outline-none focus:border-orange-500">
      </div>

      <div>
        <label class="block text-xs uppercase tracking-widest text-gray-400 mb-2 font-semibold">Photo (détection auto Claude)</label>
        <div class="flex gap-2">
          <label class="flex-1 bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-gray-400 text-sm cursor-pointer hover:border-orange-500 transition-colors flex items-center gap-2 min-h-[52px]">
            <svg class="w-5 h-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6.827 6.175A2.31 2.31 0 0 1 5.186 7.23c-.38.054-.757.112-1.134.175C2.999 7.58 2.25 8.507 2.25 9.574V18a2.25 2.25 0 0 0 2.25 2.25h15A2.25 2.25 0 0 0 21.75 18V9.574c0-1.067-.75-1.994-1.802-2.169a47.865 47.865 0 0 0-1.134-.175 2.31 2.31 0 0 1-1.64-1.055l-.822-1.316a2.192 2.192 0 0 0-1.736-1.039 48.774 48.774 0 0 0-5.232 0 2.192 2.192 0 0 0-1.736 1.039l-.821 1.316Z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 12.75a4.5 4.5 0 1 1-9 0 4.5 4.5 0 0 1 9 0ZM18.75 10.5h.008v.008h-.008V10.5Z" />
            </svg>
            <span id="photoLabel" class="truncate">Choisir une photo</span>
            <input type="file" id="newExPhoto" accept="image/*" capture="environment" class="hidden">
          </label>
          <button id="detectBtn"
            class="hidden shrink-0 bg-orange-500 hover:bg-orange-400 text-white text-sm font-bold rounded-xl px-4 transition-colors">
            Détecter
          </button>
        </div>
        <div id="detectResult" class="hidden mt-2 bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-sm">
          <p id="detectResultText" class="text-gray-300"></p>
        </div>
      </div>

      <button id="saveNewExBtn"
        class="w-full bg-orange-500 hover:bg-orange-400 text-white text-lg font-bold uppercase heading rounded-xl py-4 transition-colors disabled:opacity-60">
        Créer l'exercice
      </button>
    </div>
  </div>

  <!-- Bottom nav: 3 tabs -->
  <nav class="fixed bottom-0 left-0 right-0 bg-gray-900 border-t border-gray-800 z-50">
    <div class="grid grid-cols-3 h-16">
      <a href="index.html" class="flex flex-col items-center justify-center gap-1 text-xs font-semibold text-orange-500 cursor-pointer" aria-current="page">
        <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931Zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0 1 15.75 21H5.25A2.25 2.25 0 0 1 3 18.75V8.25A2.25 2.25 0 0 1 5.25 6H10" />
        </svg>
        Séance
      </a>
      <a href="history.html" class="flex flex-col items-center justify-center gap-1 text-xs font-semibold text-gray-500 hover:text-gray-300 transition-colors duration-200 cursor-pointer">
        <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 0 1 3 19.875v-6.75ZM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V8.625ZM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V4.125Z" />
        </svg>
        Historique
      </a>
      <a href="weekly.html" class="flex flex-col items-center justify-center gap-1 text-xs font-semibold text-gray-500 hover:text-gray-300 transition-colors duration-200 cursor-pointer">
        <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75m-18 0v-7.5A2.25 2.25 0 0 1 5.25 9h13.5A2.25 2.25 0 0 1 21 9v7.5m-9-6h.008v.008H12V9Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0ZM12 12h.008v.008H12V12Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0ZM9.75 12h.008v.008H9.75V12Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z" />
        </svg>
        Semaine
      </a>
    </div>
  </nav>

  <script src="app.js"></script>
  <script>
    // ── State ──────────────────────────────────────────────────────────────
    let allExercises = [];
    let selectedExercise = null;
    let detectedMuscles = [];

    // ── Init ───────────────────────────────────────────────────────────────
    document.getElementById('date').value = todayISO();
    document.getElementById('dateDisplay').textContent = new Date().toLocaleDateString('fr-FR', {
      weekday: 'long', day: 'numeric', month: 'long',
    });

    // ── Helpers ────────────────────────────────────────────────────────────
    function daysAgo(dateStr) {
      const diff = Math.floor((Date.now() - new Date(dateStr + 'T12:00:00').getTime()) / 86400000);
      if (diff <= 0) return "aujourd'hui";
      if (diff === 1) return 'hier';
      return `il y a ${diff} jours`;
    }

    function formatLastSession(session) {
      if (session.sets_data && session.sets_data.length > 0) {
        const n = session.sets_data.length;
        const r = session.sets_data[0].reps;
        const w = session.sets_data[0].weight_kg;
        return `${n}×${r} reps @ ${w} kg`;
      }
      if (session.sets && session.reps && session.weight_kg != null) {
        return `${session.sets}×${session.reps} reps @ ${session.weight_kg} kg`;
      }
      return 'séance précédente';
    }

    // ── Exercise list rendering ────────────────────────────────────────────
    function renderExerciseList(exercises, filter) {
      const list = document.getElementById('exerciseList');
      const q = (filter || '').trim().toLowerCase();

      const filtered = q
        ? exercises.filter(e =>
            e.name.toLowerCase().includes(q) ||
            (e.description || '').toLowerCase().includes(q) ||
            (e.muscles || []).some(m => m.toLowerCase().includes(q))
          )
        : exercises;

      list.innerHTML = '';

      if (filtered.length === 0) {
        list.innerHTML = '<p class="text-gray-500 text-sm text-center py-6">Aucun exercice trouvé</p>';
        return;
      }

      if (q) {
        // Search mode: flat list sorted alphabetically
        const sorted = [...filtered].sort((a, b) => a.name.localeCompare(b.name));
        const grid = document.createElement('div');
        grid.className = 'grid grid-cols-2 gap-2';
        sorted.forEach(ex => grid.appendChild(createExBtn(ex, false)));
        list.appendChild(grid);
        return;
      }

      // Normal mode: recent + grouped others
      const byRecency = [...filtered].sort((a, b) => {
        if (!a.last_session_date && !b.last_session_date) return 0;
        if (!a.last_session_date) return 1;
        if (!b.last_session_date) return -1;
        return b.last_session_date.localeCompare(a.last_session_date);
      });

      const recent = byRecency.filter(e => e.last_session_date).slice(0, 8);
      const recentIds = new Set(recent.map(e => e.id));
      const others = filtered
        .filter(e => !recentIds.has(e.id))
        .sort((a, b) => {
          const ma = (a.muscles && a.muscles[0]) || 'zzz';
          const mb = (b.muscles && b.muscles[0]) || 'zzz';
          return ma !== mb ? ma.localeCompare(mb) : a.name.localeCompare(b.name);
        });

      if (recent.length > 0) {
        const sec = document.createElement('div');
        const hdr = document.createElement('p');
        hdr.className = 'text-xs uppercase tracking-widest text-gray-500 font-semibold mb-2';
        hdr.textContent = 'Récents';
        sec.appendChild(hdr);
        const grid = document.createElement('div');
        grid.className = 'grid grid-cols-2 gap-2';
        recent.forEach(ex => grid.appendChild(createExBtn(ex, true)));
        sec.appendChild(grid);
        list.appendChild(sec);
      }

      if (others.length > 0) {
        const wrapper = document.createElement('div');
        wrapper.className = 'space-y-4';

        if (recent.length > 0) {
          const hdr = document.createElement('p');
          hdr.className = 'text-xs uppercase tracking-widest text-gray-500 font-semibold';
          hdr.textContent = 'Tous les exercices';
          wrapper.appendChild(hdr);
        }

        // Group by first muscle
        const groups = {};
        others.forEach(ex => {
          const m = (ex.muscles && ex.muscles[0]) || 'Autres';
          if (!groups[m]) groups[m] = [];
          groups[m].push(ex);
        });

        Object.keys(groups).sort().forEach(muscle => {
          const sec = document.createElement('div');
          const hdr = document.createElement('p');
          hdr.className = 'text-xs uppercase tracking-widest text-gray-600 font-semibold mb-2';
          hdr.textContent = muscle;
          sec.appendChild(hdr);
          const grid = document.createElement('div');
          grid.className = 'grid grid-cols-2 gap-2';
          groups[muscle].forEach(ex => grid.appendChild(createExBtn(ex, false)));
          sec.appendChild(grid);
          wrapper.appendChild(sec);
        });

        list.appendChild(wrapper);
      }
    }

    function createExBtn(ex, isRecent) {
      const btn = document.createElement('button');
      btn.className = 'bg-gray-800 hover:bg-gray-700 border border-gray-700 hover:border-orange-500 rounded-xl px-3 py-3 text-left transition-colors w-full';

      const badge = isRecent
        ? '<span class="inline-block bg-orange-500/20 text-orange-400 text-[10px] font-bold uppercase px-1.5 py-0.5 rounded mb-1">Récent</span><br>'
        : '';
      const muscles = ex.muscles && ex.muscles.length > 0
        ? `<p class="text-gray-500 text-xs mt-1 truncate">${ex.muscles.slice(0, 2).map(escapeHtml).join(', ')}</p>`
        : '';

      btn.innerHTML = `${badge}<p class="text-white font-semibold text-sm leading-tight">${escapeHtml(ex.name)}</p>${muscles}`;
      btn.addEventListener('click', () => selectExercise(ex));
      return btn;
    }

    // ── Input mode helpers ─────────────────────────────────────────────────
    function showInputModePanel() {
      document.getElementById('inputModePanel').classList.remove('hidden');
      document.getElementById('voicePanel').classList.add('hidden');
      document.getElementById('manualPanel').classList.add('hidden');
    }

    function switchToManual() {
      document.getElementById('inputModePanel').classList.add('hidden');
      document.getElementById('voicePanel').classList.add('hidden');
      document.getElementById('manualPanel').classList.remove('hidden');
      if (document.getElementById('setsList').children.length === 0) addSet();
    }

    // ── Exercise selection ─────────────────────────────────────────────────
    async function selectExercise(ex) {
      selectedExercise = ex;
      document.getElementById('exerciseSection').classList.add('hidden');
      document.getElementById('sessionForm').classList.remove('hidden');
      document.getElementById('selectedExerciseName').textContent = ex.name;
      document.getElementById('lastSession').classList.add('hidden');
      document.getElementById('setsList').innerHTML = '';
      showInputModePanel();
      window.scrollTo({ top: 0, behavior: 'smooth' });

      try {
        const history = await api.getHistory(ex.name);
        if (history.length) {
          const last = history[0];
          document.getElementById('lastSessionText').textContent =
            `${formatLastSession(last)} — ${daysAgo(last.date)}`;
          document.getElementById('lastSession').classList.remove('hidden');
          // Pre-populate setsList (inside hidden manualPanel, ready when Manuel clicked)
          if (last.sets_data && last.sets_data.length > 0) {
            addSet(last.sets_data[0].reps, last.sets_data[0].weight_kg);
          } else if (last.reps && last.weight_kg != null) {
            addSet(last.reps, last.weight_kg);
          } else {
            addSet();
          }
        } else {
          addSet();
        }
      } catch {
        addSet();
      }
    }

    // ── Set rows ───────────────────────────────────────────────────────────
    function renumberSets() {
      Array.from(document.getElementById('setsList').children).forEach((row, i) => {
        row.querySelector('.set-label').textContent = `Série ${i + 1}`;
      });
    }

    function addSet(defaultReps, defaultWeight) {
      const setsList = document.getElementById('setsList');
      const idx = setsList.children.length;

      // Pre-fill from previous row when no defaults given
      if (defaultReps === undefined && idx > 0) {
        const prev = setsList.lastElementChild;
        defaultReps = parseInt(prev.querySelector('.reps-input').value) || 8;
        defaultWeight = parseFloat(prev.querySelector('.weight-input').value) || 20;
      }

      const reps = defaultReps || 8;
      const weight = defaultWeight || 20;

      const row = document.createElement('div');
      row.className = 'flex items-center gap-2 bg-gray-800 border border-gray-700 rounded-xl px-3 py-2';
      row.innerHTML = `
        <span class="set-label text-gray-500 text-xs font-semibold w-14 shrink-0 heading uppercase">Série ${idx + 1}</span>
        <div class="flex-1 flex gap-2">
          <div class="flex-1">
            <input type="number" min="1" max="50" value="${reps}" inputmode="numeric"
              class="reps-input w-full bg-gray-700 border border-gray-600 text-white text-2xl font-bold text-center rounded-lg py-2.5 focus:outline-none focus:border-orange-500">
            <p class="text-gray-500 text-[10px] text-center mt-0.5 uppercase tracking-wider">reps</p>
          </div>
          <div class="flex-1">
            <input type="number" min="0" step="2.5" value="${weight}" inputmode="decimal"
              class="weight-input w-full bg-gray-700 border border-gray-600 text-white text-2xl font-bold text-center rounded-lg py-2.5 focus:outline-none focus:border-orange-500">
            <p class="text-gray-500 text-[10px] text-center mt-0.5 uppercase tracking-wider">kg</p>
          </div>
        </div>
        <button class="remove-set text-gray-600 hover:text-red-400 transition-colors p-1 shrink-0">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12"/>
          </svg>
        </button>
      `;

      row.querySelector('.remove-set').addEventListener('click', () => {
        if (setsList.children.length > 1) {
          row.remove();
          renumberSets();
        }
      });

      setsList.appendChild(row);
    }

    // ── Event listeners ────────────────────────────────────────────────────
    document.getElementById('changeExerciseBtn').addEventListener('click', () => {
      selectedExercise = null;
      document.getElementById('sessionForm').classList.add('hidden');
      document.getElementById('exerciseSection').classList.remove('hidden');
      document.getElementById('exerciseSearch').value = '';
      renderExerciseList(allExercises, '');
    });

    document.getElementById('manualBtn').addEventListener('click', () => switchToManual());

    document.getElementById('addSetBtn').addEventListener('click', () => addSet());

    document.getElementById('exerciseSearch').addEventListener('input', function () {
      renderExerciseList(allExercises, this.value);
    });

    // ── Voice dictation ────────────────────────────────────────────────────
    function parseVoiceInput(transcript) {
      const t = transcript.toLowerCase()
        .replace(/répétitions?/g, 'reps')
        .replace(/kilos?/g, 'kg')
        .replace(/séries?/g, 'series')
        .replace(/avec/g, '');

      const numSetsMatch = t.match(/(\d+)\s*series/);
      const repsMatch = t.match(/(\d+)\s*reps/);
      const weightMatch = t.match(/(\d+(?:[.,]\d+)?)\s*kg/);

      const numSets = numSetsMatch ? parseInt(numSetsMatch[1]) : 1;
      const reps = repsMatch ? parseInt(repsMatch[1]) : null;
      const weight = weightMatch ? parseFloat(weightMatch[1].replace(',', '.')) : null;

      if (reps !== null || weight !== null) {
        document.getElementById('setsList').innerHTML = '';
        for (let i = 0; i < numSets; i++) {
          addSet(reps ?? 8, weight ?? 20);
        }
        renumberSets();
        switchToManual();
        showToast(`${numSets} série${numSets > 1 ? 's' : ''} : ${reps ?? '?'} reps @ ${weight ?? '?'} kg`);
      } else {
        showToast(`Non reconnu : "${transcript}"`, 'error');
        showInputModePanel();
      }
    }

    let activeRecognition = null;

    document.getElementById('dictateBtn').addEventListener('click', () => {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) return showToast('Reconnaissance vocale non disponible', 'error');

      document.getElementById('inputModePanel').classList.add('hidden');
      document.getElementById('voicePanel').classList.remove('hidden');

      const recognition = new SR();
      recognition.lang = 'fr-FR';
      recognition.continuous = false;
      recognition.interimResults = false;
      activeRecognition = recognition;

      recognition.onresult = (event) => {
        activeRecognition = null;
        document.getElementById('voicePanel').classList.add('hidden');
        parseVoiceInput(event.results[0][0].transcript);
      };

      recognition.onerror = (event) => {
        activeRecognition = null;
        document.getElementById('voicePanel').classList.add('hidden');
        if (event.error !== 'aborted') showToast('Erreur de reconnaissance vocale', 'error');
        showInputModePanel();
      };

      recognition.onend = () => {
        activeRecognition = null;
        if (!document.getElementById('manualPanel').classList.contains('hidden')) return;
        document.getElementById('voicePanel').classList.add('hidden');
        showInputModePanel();
      };

      recognition.start();
    });

    document.getElementById('cancelVoiceBtn').addEventListener('click', () => {
      if (activeRecognition) { activeRecognition.abort(); activeRecognition = null; }
      document.getElementById('voicePanel').classList.add('hidden');
      showInputModePanel();
    });

    // ── Photo capture ──────────────────────────────────────────────────────
    document.getElementById('photoSessionBtn').addEventListener('click', () => {
      document.getElementById('photoSessionInput').value = '';
      document.getElementById('photoSessionInput').click();
    });

    document.getElementById('photoSessionInput').addEventListener('change', async function () {
      if (!this.files.length) return;
      const file = this.files[0];
      try {
        const b64 = await new Promise((res, rej) => {
          const reader = new FileReader();
          reader.onload = e => res(e.target.result.split(',')[1]);
          reader.onerror = rej;
          reader.readAsDataURL(file);
        });
        const result = await api.detectMachine(b64);
        if (result && result.name) showToast(`Machine : ${result.name}`);
      } catch {
        // Silently ignore detection failure
      }
      switchToManual();
    });

    // ── Save session ───────────────────────────────────────────────────────
    document.getElementById('submitBtn').addEventListener('click', async () => {
      if (!selectedExercise) return showToast('Choisir un exercice', 'error');

      const rows = Array.from(document.getElementById('setsList').children);
      if (rows.length === 0) return showToast('Ajouter au moins une série', 'error');

      const setsData = rows.map(row => ({
        reps: parseInt(row.querySelector('.reps-input').value),
        weight_kg: parseFloat(row.querySelector('.weight-input').value),
      }));

      if (setsData.some(s => isNaN(s.reps) || isNaN(s.weight_kg))) {
        return showToast('Vérifier les valeurs des séries', 'error');
      }

      const btn = document.getElementById('submitBtn');
      setLoading(btn, true);
      try {
        await api.createSession({
          date: document.getElementById('date').value,
          exercise_id: selectedExercise.id,
          sets_data: setsData,
        });
        const idx = allExercises.findIndex(e => e.id === selectedExercise.id);
        if (idx >= 0) allExercises[idx].last_session_date = document.getElementById('date').value;

        showToast('Séance enregistrée !');

        // Reset setsList with one pre-filled row, return to mode selector
        const last = setsData[setsData.length - 1];
        document.getElementById('setsList').innerHTML = '';
        addSet(last.reps, last.weight_kg);
        document.getElementById('lastSessionText').textContent =
          `${setsData.length}×${setsData[0].reps} reps @ ${setsData[0].weight_kg} kg — aujourd'hui`;
        document.getElementById('lastSession').classList.remove('hidden');
        showInputModePanel();
      } catch (e) {
        showToast(e.message, 'error');
      } finally {
        setLoading(btn, false);
      }
    });

    // ── New exercise modal ─────────────────────────────────────────────────
    function openModal() {
      document.getElementById('newExName').value = '';
      document.getElementById('newExDesc').value = '';
      document.getElementById('newExPhoto').value = '';
      document.getElementById('photoLabel').textContent = 'Choisir une photo';
      document.getElementById('detectBtn').classList.add('hidden');
      document.getElementById('detectResult').classList.add('hidden');
      detectedMuscles = [];
      document.getElementById('newExerciseModal').style.display = 'flex';
      document.getElementById('newExName').focus();
    }

    function closeModal() {
      document.getElementById('newExerciseModal').style.display = 'none';
    }

    document.getElementById('newExerciseBtn').addEventListener('click', openModal);
    document.getElementById('closeModalBtn').addEventListener('click', closeModal);
    document.getElementById('newExerciseModal').addEventListener('click', e => {
      if (e.target === document.getElementById('newExerciseModal')) closeModal();
    });

    document.getElementById('newExPhoto').addEventListener('change', function () {
      if (this.files.length > 0) {
        document.getElementById('photoLabel').textContent = this.files[0].name;
        document.getElementById('detectBtn').classList.remove('hidden');
      }
    });

    document.getElementById('detectBtn').addEventListener('click', async () => {
      const file = document.getElementById('newExPhoto').files[0];
      if (!file) return;
      const btn = document.getElementById('detectBtn');
      setLoading(btn, true);
      try {
        const b64 = await new Promise((res, rej) => {
          const reader = new FileReader();
          reader.onload = e => res(e.target.result.split(',')[1]);
          reader.onerror = rej;
          reader.readAsDataURL(file);
        });
        const result = await api.detectMachine(b64);
        document.getElementById('detectResultText').innerHTML =
          `<strong class="text-white">${escapeHtml(result.name)}</strong>` +
          (result.muscles && result.muscles.length
            ? ` — <span class="text-orange-400">${result.muscles.map(escapeHtml).join(', ')}</span>`
            : '');
        document.getElementById('detectResult').classList.remove('hidden');
        if (result.name) document.getElementById('newExName').value = result.name;
        detectedMuscles = result.muscles || [];
      } catch {
        showToast('Détection échouée', 'error');
      } finally {
        setLoading(btn, false);
      }
    });

    document.getElementById('saveNewExBtn').addEventListener('click', async () => {
      const name = document.getElementById('newExName').value.trim();
      if (!name) return showToast('Le nom est requis', 'error');
      const btn = document.getElementById('saveNewExBtn');
      setLoading(btn, true);
      try {
        const newEx = await api.createExercise({
          name,
          description: document.getElementById('newExDesc').value.trim() || null,
          muscles: detectedMuscles.length > 0 ? detectedMuscles : null,
        });
        newEx.last_session_date = null;
        newEx.session_count = 0;
        allExercises.push(newEx);
        renderExerciseList(allExercises, document.getElementById('exerciseSearch').value);
        closeModal();
        showToast('Exercice créé !');
      } catch (e) {
        showToast(e.message, 'error');
      } finally {
        setLoading(btn, false);
      }
    });

    // ── Load ───────────────────────────────────────────────────────────────
    api.getExercises()
      .then(exercises => {
        allExercises = exercises;
        renderExerciseList(allExercises, '');
      })
      .catch(() => showToast('Backend inaccessible', 'error'));
  </script>
</body>
</html>
