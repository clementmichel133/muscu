<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Séance — Muscu</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family:'Barlow',sans-serif; background:#030712; touch-action:manipulation; }
    .heading { font-family:'Barlow Condensed',sans-serif; letter-spacing:.04em; }
    @media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}}
    .modal-scroll::-webkit-scrollbar { width:4px; }
    .modal-scroll::-webkit-scrollbar-track { background:#111827; border-radius:2px; }
    .modal-scroll::-webkit-scrollbar-thumb { background:#4B5563; border-radius:2px; }
    .modal-scroll { scrollbar-width:thin; scrollbar-color:#4B5563 #111827; }
    .modal-scroll, .modal-body {
      overflow-y: scroll !important;
      -webkit-overflow-scrolling: touch !important;
      max-height: 75vh !important;
    }
  </style>
</head>
<body class="min-h-screen text-gray-100 pb-28">

  <!-- ── Header ─────────────────────────────────────────────────────────────── -->
  <header class="px-4 pt-8 pb-3 flex items-start justify-between">
    <div class="flex items-center gap-3">
      <button id="backBtn" class="hidden w-9 h-9 rounded-full bg-gray-800 flex items-center justify-center text-gray-400 hover:text-white transition-colors cursor-pointer" aria-label="Retour">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5"/></svg>
      </button>
      <div>
        <h1 class="text-3xl font-bold text-orange-500 uppercase heading leading-none">Séance</h1>
        <p class="text-gray-400 text-sm" id="dateDisplay"></p>
      </div>
    </div>
    <div id="workoutTypeBadge" class="hidden mt-1 text-xs font-bold uppercase heading px-3 py-1.5 bg-gray-800 border border-gray-700 rounded-full text-orange-400"></div>
  </header>

  <main class="px-4 space-y-4">

    <!-- ── View: type selector ────────────────────────────────────────────── -->
    <div id="typeSelectorView">
      <p class="text-xs uppercase tracking-widest text-gray-500 font-semibold mb-3">Choisir un type de séance</p>
      <div class="grid grid-cols-2 gap-3" id="typeGrid"></div>
      <button id="customTypeBtn"
        class="mt-3 w-full flex items-center justify-center gap-2 bg-gray-800 hover:bg-gray-700 border border-gray-700 hover:border-orange-500 rounded-xl py-4 text-gray-300 hover:text-white font-semibold transition-colors cursor-pointer min-h-[56px]">
        <svg class="w-5 h-5 text-orange-500" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 6h9.75M10.5 6a1.5 1.5 0 1 1-3 0m3 0a1.5 1.5 0 1 0-3 0M3.75 6H7.5m3 12h9.75m-9.75 0a1.5 1.5 0 0 1-3 0m3 0a1.5 1.5 0 0 0-3 0m-3.75 0H7.5m9-6h3.75m-3.75 0a1.5 1.5 0 0 1-3 0m3 0a1.5 1.5 0 0 0-3 0m-9.75 0h9.75"/></svg>
        Personnalisé
      </button>
    </div>

    <!-- ── View: custom muscle selector ──────────────────────────────────── -->
    <div id="customView" class="hidden space-y-4">
      <p class="text-xs uppercase tracking-widest text-gray-500 font-semibold">Groupes musculaires</p>
      <div id="muscleChips" class="flex flex-wrap gap-2"></div>
      <div class="flex gap-3">
        <button id="cancelCustomBtn" class="flex-1 bg-gray-800 border border-gray-700 text-gray-400 font-semibold rounded-xl py-3 transition-colors hover:bg-gray-700 cursor-pointer">
          Annuler
        </button>
        <button id="startCustomBtn" class="flex-1 bg-orange-500 hover:bg-orange-400 text-white font-bold uppercase heading rounded-xl py-3 transition-colors cursor-pointer disabled:opacity-40">
          Commencer
        </button>
      </div>
    </div>

    <!-- ── View: session ─────────────────────────────────────────────────── -->
    <div id="sessionView" class="hidden" style="padding-bottom:80px">
      <div id="exerciseCardsContainer" class="flex flex-col gap-3"></div>

      <!-- + button in flow, with hint when empty -->
      <div class="flex flex-col items-center gap-3 py-8">
        <p id="emptyHint" class="hidden text-gray-600 text-sm text-center">
          Appuie sur <span class="text-orange-500 font-semibold">+</span> pour commencer
        </p>
        <button id="addExerciseFab"
          class="cursor-pointer"
          style="width:56px;height:56px;background:#F97316;border-radius:50%;border:none;padding:14px;box-shadow:0 4px 16px rgba(249,115,22,.4)"
          aria-label="Ajouter un exercice">
          <svg width="28" height="28" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="white"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
        </button>
      </div>
    </div>

  </main>

  <!-- ── Bouton Terminer fixe (bas droite) ──────────────────────────────────── -->
  <button id="finishWorkoutBtn"
    class="hidden fixed z-40 cursor-pointer"
    style="bottom:80px;right:16px;background:transparent;border:2px solid #C2510A;border-radius:8px;color:#C2510A;font-weight:bold;font-size:14px;padding:8px 16px"
    aria-label="Finir la séance">
    Finir Séance
  </button>

  <!-- ── Modal: exercise selection ──────────────────────────────────────────── -->
  <div id="exSelectModal" class="hidden fixed inset-0 z-50 flex items-end justify-center bg-black/75" role="dialog" aria-label="Sélectionner un exercice">
    <div class="absolute inset-0" id="exSelectBackdrop"></div>
    <div class="relative bg-gray-900 rounded-t-2xl w-full flex flex-col" style="height:85vh;max-height:85vh">
      <div class="flex-shrink-0 flex items-center justify-between px-4 py-3 border-b border-gray-800">
        <h2 class="text-lg font-bold heading uppercase">Ajouter un exercice</h2>
        <button id="closeExSelect" class="text-gray-500 hover:text-white transition-colors cursor-pointer p-1" aria-label="Fermer">
          <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="flex-shrink-0 px-4 py-2">
        <div class="relative">
          <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-500 pointer-events-none" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z"/></svg>
          <input type="text" id="exSelectSearch" placeholder="Rechercher…"
            class="w-full bg-gray-800 border border-gray-700 text-gray-100 rounded-xl pl-10 pr-4 py-3 focus:outline-none focus:border-orange-500 min-h-[48px]">
        </div>
      </div>
      <div id="exSelectList" class="modal-scroll flex-1 overflow-y-scroll overscroll-contain px-4 pb-4 space-y-1" style="min-height:0"></div>
    </div>
  </div>

  <!-- ── Modal: exercise info ────────────────────────────────────────────────── -->
  <div id="infoModal" class="hidden fixed inset-0 z-50 flex items-end justify-center bg-black/75" role="dialog" aria-label="Fiche exercice">
    <div class="absolute inset-0" id="infoBackdrop"></div>
    <div class="relative bg-gray-900 rounded-t-2xl w-full flex flex-col" style="height:90vh;max-height:90vh">
      <!-- Header -->
      <div class="flex-shrink-0 flex items-center justify-between px-4 py-3 border-b border-gray-800">
        <h2 id="infoName" class="text-lg font-bold heading uppercase text-orange-400 truncate pr-4"></h2>
        <button id="closeInfo" class="text-gray-500 hover:text-white transition-colors cursor-pointer p-1 flex-shrink-0" aria-label="Fermer">
          <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <!-- Scrollable body -->
      <div class="modal-scroll flex-1 overflow-y-scroll overscroll-contain pb-6" style="min-height:0">
        <!-- Image -->
        <div id="infoImgSection" class="px-4 pt-3"></div>
        <!-- Muscles + silhouette -->
        <div class="px-4 pt-3 space-y-2">
          <p class="text-xs uppercase tracking-widest text-gray-500 font-semibold">Muscles</p>
          <div id="infoMuscles" class="flex flex-wrap gap-1.5"></div>
          <div id="infoBodySvg" class="mt-1"></div>
        </div>
        <!-- Record -->
        <div id="infoRecordWrap" class="hidden mx-4 mt-3 bg-orange-500/10 border border-orange-500/20 rounded-xl px-4 py-3">
          <p class="text-xs uppercase tracking-widest text-orange-400 font-semibold mb-0.5">Ton record</p>
          <p id="infoRecord" class="text-white font-bold text-base"></p>
        </div>
        <!-- Personalised tip -->
        <div class="px-4 mt-3">
          <p class="text-xs uppercase tracking-widest text-gray-500 font-semibold mb-1.5">Conseil</p>
          <div id="infoTip" class="text-gray-400 text-sm leading-relaxed italic"></div>
        </div>
        <!-- Instructions -->
        <div id="infoInstructionsWrap" class="hidden px-4 mt-3">
          <p class="text-xs uppercase tracking-widest text-gray-500 font-semibold mb-2">Instructions</p>
          <div id="infoInstructions" class="space-y-2"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ── Nav ─────────────────────────────────────────────────────────────────── -->
  <nav class="fixed bottom-0 left-0 right-0 bg-gray-900 border-t border-gray-800 z-50">
    <div class="grid grid-cols-4 h-16">
      <a href="index.html" class="flex flex-col items-center justify-center gap-1 text-xs font-semibold text-orange-500 cursor-pointer" aria-current="page">
        <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931Zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0 1 15.75 21H5.25A2.25 2.25 0 0 1 3 18.75V8.25A2.25 2.25 0 0 1 5.25 6H10"/></svg>
        Séance
      </a>
      <a href="exercises.html" class="flex flex-col items-center justify-center gap-1 text-xs font-semibold text-gray-500 hover:text-gray-300 transition-colors cursor-pointer">
        <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M8.25 6.75h12M8.25 12h12m-12 5.25h12M3.75 6.75h.007v.008H3.75V6.75Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0ZM3.75 12h.007v.008H3.75V12Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm-.375 5.25h.007v.008H3.75v-.008Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z"/></svg>
        Exercices
      </a>
      <a href="history.html" class="flex flex-col items-center justify-center gap-1 text-xs font-semibold text-gray-500 hover:text-gray-300 transition-colors cursor-pointer">
        <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 0 1 3 19.875v-6.75ZM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V8.625ZM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V4.125Z"/></svg>
        Historique
      </a>
      <a href="weekly.html" class="flex flex-col items-center justify-center gap-1 text-xs font-semibold text-gray-500 hover:text-gray-300 transition-colors cursor-pointer">
        <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75m-18 0v-7.5A2.25 2.25 0 0 1 5.25 9h13.5A2.25 2.25 0 0 1 21 9v7.5m-9-6h.008v.008H12V9Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0ZM12 12h.008v.008H12V12Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0ZM9.75 12h.008v.008H9.75V12Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z"/></svg>
        Semaine
      </a>
    </div>
  </nav>

  <script src="app.js"></script>
  <script>
  // ── Config ──────────────────────────────────────────────────────────────────
  const TYPES = {
    pecs_biceps: {
      label: 'Pecs / Biceps',
      color: 'orange',
      bg: 'bg-orange-500/10 border-orange-500/30 hover:border-orange-500',
      iconColor: 'text-orange-500',
      icon: `<svg class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15.362 5.214A8.252 8.252 0 0 1 12 21 8.25 8.25 0 0 1 6.038 7.047 8.287 8.287 0 0 0 9 9.601a8.983 8.983 0 0 1 3.361-6.867 8.21 8.21 0 0 0 3 2.48Z"/><path stroke-linecap="round" stroke-linejoin="round" d="M12 18a3.75 3.75 0 0 0 .495-7.468 5.99 5.99 0 0 0-1.925 3.547 5.975 5.975 0 0 1-2.133-1.001A3.75 3.75 0 0 0 12 18Z"/></svg>`,
    },
    dos_triceps: {
      label: 'Dos / Triceps',
      color: 'blue',
      bg: 'bg-blue-500/10 border-blue-500/30 hover:border-blue-500',
      iconColor: 'text-blue-400',
      icon: `<svg class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99"/></svg>`,
    },
    legs: {
      label: 'Legs',
      color: 'green',
      bg: 'bg-green-500/10 border-green-500/30 hover:border-green-500',
      iconColor: 'text-green-400',
      icon: `<svg class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m3.75 13.5 10.5-11.25L12 10.5h8.25L9.75 21.75 12 13.5H3.75Z"/></svg>`,
    },
    epaules_mollets: {
      label: 'Épaules / Mollets',
      color: 'purple',
      bg: 'bg-purple-500/10 border-purple-500/30 hover:border-purple-500',
      iconColor: 'text-purple-400',
      icon: `<svg class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 18 9 11.25l4.306 4.306a11.95 11.95 0 0 1 5.814-5.518l2.74-1.22m0 0-5.94-2.281m5.94 2.28-2.28 5.941"/></svg>`,
    },
  };

  const CUSTOM_MUSCLES = ['Pectoraux','Biceps','Dos','Triceps','Jambes','Épaules','Mollets','Cardio','Abdos'];

  // ── State ────────────────────────────────────────────────────────────────────
  let currentWorkout = null;
  let allExercises   = [];
  let lastWorkouts   = {}; // exerciseId -> {date, sets}
  const setTimers    = {}; // setId -> timer

  // ── Init ─────────────────────────────────────────────────────────────────────
  document.getElementById('dateDisplay').textContent = new Date().toLocaleDateString('fr-FR', {
    weekday:'long', day:'numeric', month:'long',
  });

  async function init() {
    api.getExercises().then(exs => { allExercises = exs; }).catch(() => {});
    renderTypeButtons();
    renderMuscleChips();

    const savedDate = localStorage.getItem('muscu_workout_date');
    const savedId   = localStorage.getItem('muscu_workout_id');
    if (savedDate === todayISO() && savedId) {
      try {
        const w = await api.getWorkout(parseInt(savedId));
        openSession(w);
        return;
      } catch { /* stale ID */ }
    }
    showView('typeSelectorView');
  }

  // ── Views ─────────────────────────────────────────────────────────────────────
  function showView(id) {
    ['typeSelectorView','customView','sessionView'].forEach(v =>
      document.getElementById(v).classList.add('hidden')
    );
    document.getElementById(id).classList.remove('hidden');
    const inSession = id === 'sessionView';
    document.getElementById('finishWorkoutBtn').classList.toggle('hidden', !inSession);
    document.getElementById('backBtn').classList.toggle('hidden', !inSession);
  }

  // ── Type buttons ──────────────────────────────────────────────────────────────
  function renderTypeButtons() {
    const grid = document.getElementById('typeGrid');
    grid.innerHTML = Object.entries(TYPES).map(([key, t]) => `
      <button onclick="handleTypeClick('${key}')"
        class="flex flex-col items-center justify-center gap-2 rounded-xl border py-6 px-3 transition-colors cursor-pointer min-h-[110px] ${t.bg}">
        <span class="${t.iconColor}">${t.icon}</span>
        <span class="font-bold text-sm text-center heading uppercase tracking-wide text-gray-200">${t.label}</span>
      </button>
    `).join('');
  }

  function handleTypeClick(type) {
    startWorkout(type);
  }

  // ── Custom type ───────────────────────────────────────────────────────────────
  const selectedMuscles = new Set();

  function renderMuscleChips() {
    document.getElementById('muscleChips').innerHTML = CUSTOM_MUSCLES.map(m => `
      <button onclick="toggleMuscle('${m}')" data-muscle="${m}"
        class="muscle-chip px-3 py-2 rounded-full border text-sm font-semibold transition-colors cursor-pointer
               bg-gray-800 border-gray-700 text-gray-400 hover:border-orange-500 hover:text-white min-h-[40px]">
        ${m}
      </button>
    `).join('');
  }

  function toggleMuscle(m) {
    selectedMuscles.has(m) ? selectedMuscles.delete(m) : selectedMuscles.add(m);
    document.querySelectorAll(`[data-muscle="${m}"]`).forEach(btn => {
      const on = selectedMuscles.has(m);
      btn.classList.toggle('bg-orange-500', on);
      btn.classList.toggle('border-orange-500', on);
      btn.classList.toggle('text-white', on);
      btn.classList.toggle('bg-gray-800', !on);
      btn.classList.toggle('border-gray-700', !on);
      btn.classList.toggle('text-gray-400', !on);
    });
    document.getElementById('startCustomBtn').disabled = selectedMuscles.size === 0;
  }

  document.getElementById('customTypeBtn').addEventListener('click', () => {
    selectedMuscles.clear();
    renderMuscleChips();
    document.getElementById('startCustomBtn').disabled = true;
    showView('customView');
  });
  document.getElementById('cancelCustomBtn').addEventListener('click', () => showView('typeSelectorView'));
  document.getElementById('startCustomBtn').addEventListener('click', () => {
    startWorkout('custom', [...selectedMuscles]);
  });

  // ── Workout lifecycle ─────────────────────────────────────────────────────────
  async function startWorkout(type, muscles = null) {
    try {
      const w = await api.createWorkout({ date: todayISO(), type, muscles });
      openSession(w);
    } catch (e) { showToast(e.message, 'error'); }
  }

  function openSession(workout) {
    currentWorkout = workout;
    localStorage.setItem('muscu_workout_date', workout.date);
    localStorage.setItem('muscu_workout_id', String(workout.id));

    const typeDef = TYPES[workout.type];
    const badge = document.getElementById('workoutTypeBadge');
    badge.textContent = typeDef ? typeDef.label : workout.type;
    badge.classList.remove('hidden');

    showView('sessionView');

    const container = document.getElementById('exerciseCardsContainer');
    container.innerHTML = '';
    for (const we of (workout.exercises || [])) {
      container.appendChild(buildExerciseCard(we));
    }
    updateEmptyHint();
  }

  document.getElementById('backBtn').addEventListener('click', () => {
    currentWorkout = null;
    document.getElementById('workoutTypeBadge').classList.add('hidden');
    showView('typeSelectorView');
  });

  document.getElementById('finishWorkoutBtn').addEventListener('click', () => {
    showToast('Séance terminée !');
    currentWorkout = null;
    document.getElementById('workoutTypeBadge').classList.add('hidden');
    showView('typeSelectorView');
  });

  // ── Exercise cards ────────────────────────────────────────────────────────────
  function buildExerciseCard(we) {
    const card = document.createElement('div');
    card.id = `we-${we.id}`;
    card.className = 'bg-gray-800 border border-gray-700 rounded-xl overflow-hidden';
    card.dataset.weId = we.id;
    card.dataset.exerciseId = we.exercise_id;

    card.innerHTML = `
      <div class="px-4 py-3 border-b border-gray-700/60">
        <div class="flex items-start gap-2">
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-2 flex-wrap">
              <span class="font-bold text-white text-base leading-snug">${escapeHtml(we.name)}</span>
              <button class="info-btn w-6 h-6 rounded-full bg-gray-700 hover:bg-orange-500/20 text-gray-400 hover:text-orange-400 flex items-center justify-center transition-colors cursor-pointer flex-shrink-0" aria-label="Fiche exercice">
                <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9.879 7.519c1.171-1.025 3.071-1.025 4.242 0 1.172 1.025 1.172 2.687 0 3.712-.203.179-.43.326-.67.442-.745.361-1.45.999-1.45 1.827v.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 5.25h.008v.008H12v-.008Z"/></svg>
              </button>
            </div>
            <div class="flex flex-wrap gap-1 mt-1">

          </div>

      <div class="px-3 pb-3 pt-1">
        <button class="add-set-btn w-full bg-gray-700/50 hover:bg-gray-700 border border-dashed border-gray-600 hover:border-orange-500/60 text-gray-500 hover:text-gray-300 text-sm font-semibold rounded-lg py-2 transition-colors cursor-pointer flex items-center justify-center gap-1.5 min-h-[40px]">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>

    // Existing sets
    for (const set of (we.sets || [])) {
      card.querySelector('.sets-container').appendChild(buildSetRow(set, card));

    card.querySelector('.info-btn').addEventListener('click', () => openInfoModal(we.exercise_id));

    // Load last workout ref async
    api.getExerciseLastWorkout(we.exercise_id).then(lw => {
      lastWorkouts[we.exercise_id] = lw;

        const maxW = Math.max(...lw.sets.map(s => s.weight_kg));

  // ── Set rows ──────────────────────────────────────────────────────────────────
  function buildSetRow(set, card) {
    const container = card.querySelector('.sets-container');
    const n = container.children.length + 1;

    const row = document.createElement('div');
    row.className = 'set-row flex items-center gap-2 bg-gray-700/40 rounded-lg px-2 py-1.5';
    row.dataset.setId = set.id;

    row.innerHTML = `
      <span class="set-label heading uppercase text-gray-500 text-xs font-bold w-9 flex-shrink-0 text-center">S${n}</span>
      <div class="flex-1 flex gap-1.5">
        <div class="flex-1 text-center">
          <input type="number" min="1" max="50" value="${set.reps}" inputmode="numeric"
            class="reps-input w-full bg-gray-800 border border-gray-600 text-white text-xl font-bold text-center rounded-lg py-1.5 focus:outline-none focus:border-orange-500">
          <p class="text-gray-600 text-[10px] uppercase tracking-wider mt-0.5">reps</p>
        </div>
        <div class="flex-1 text-center">
          <input type="number" min="0" step="2.5" value="${set.weight_kg}" inputmode="decimal"
            class="weight-input w-full bg-gray-800 border border-gray-600 text-white text-xl font-bold text-center rounded-lg py-1.5 focus:outline-none focus:border-orange-500">
          <p class="text-gray-600 text-[10px] uppercase tracking-wider mt-0.5">kg</p>
        </div>
      </div>
      <button class="del-set-btn text-gray-600 hover:text-red-400 transition-colors cursor-pointer p-1 flex-shrink-0" aria-label="Supprimer">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12"/></svg>
      </button>
    `;

    const repsEl   = row.querySelector('.reps-input');
    const weightEl = row.querySelector('.weight-input');

    const scheduleUpdate = () => {
      clearTimeout(setTimers[set.id]);
      setTimers[set.id] = setTimeout(() => {
        const r = parseInt(repsEl.value);
        const w = parseFloat(weightEl.value);
        if (!isNaN(r) && !isNaN(w)) api.updateSet(set.id, r, w).catch(() => {});
      }, 700);
      updateProgressBadge(card);
    };
    repsEl.addEventListener('input', scheduleUpdate);
    weightEl.addEventListener('input', scheduleUpdate);

    row.querySelector('.del-set-btn').addEventListener('click', async () => {
      try {
        await api.deleteSet(set.id);
        row.remove();
        renumberSets(card);
        updateProgressBadge(card);
      } catch (e) { showToast(e.message, 'error'); }
    });

    return row;
  }

  function renumberSets(card) {
    card.querySelectorAll('.set-row .set-label').forEach((lbl, i) => {
      lbl.textContent = `S${i + 1}`;
    });
  }

  async function handleAddSet(weId, card) {
    const rows = card.querySelectorAll('.set-row');
    let r = 8, w = 20;
    if (rows.length > 0) {
      const last = rows[rows.length - 1];
      r = parseInt(last.querySelector('.reps-input').value)   || 8;
      w = parseFloat(last.querySelector('.weight-input').value) || 20;
    } else {
      const exId = parseInt(card.dataset.exerciseId);
      const lw = lastWorkouts[exId];
      if (lw && lw.sets && lw.sets.length) { r = lw.sets[0].reps; w = lw.sets[0].weight_kg; }
    }
    try {
      const set = await api.addSet(weId, r, w);
      card.querySelector('.sets-container').appendChild(buildSetRow(set, card));
      updateProgressBadge(card);
    } catch (e) { showToast(e.message, 'error'); }
  }

  // ── Progress badge ────────────────────────────────────────────────────────────
  function updateProgressBadge(card) {
    const badge  = card.querySelector('.progress-badge');
    const exId   = parseInt(card.dataset.exerciseId);
    const lw     = lastWorkouts[exId];
    const rows   = card.querySelectorAll('.set-row');

    if (!rows.length || !lw || !lw.sets || !lw.sets.length) { badge.innerHTML = ''; return; }

    const curMax  = Math.max(...[...rows].map(r => parseFloat(r.querySelector('.weight-input').value) || 0));
    const prevMax = Math.max(...lw.sets.map(s => s.weight_kg));
    const diff    = Math.round((curMax - prevMax) * 10) / 10;

    if (diff > 0) {
      badge.innerHTML = `<span class="flex items-center gap-0.5 text-xs font-bold text-green-400 bg-green-500/10 px-2 py-0.5 rounded-full">
        <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke-width="3" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 10.5 12 3m0 0 7.5 7.5M12 3v18"/></svg>
        +${diff} kg</span>`;
    } else if (diff === 0) {
      badge.innerHTML = `<span class="flex items-center gap-0.5 text-xs font-bold text-gray-400 bg-gray-500/10 px-2 py-0.5 rounded-full">
        <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke-width="3" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5"/></svg>
        =</span>`;
    } else {
      badge.innerHTML = `<span class="flex items-center gap-0.5 text-xs font-bold text-amber-400 bg-amber-500/10 px-2 py-0.5 rounded-full">
        <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke-width="3" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 13.5 12 21m0 0-7.5-7.5M12 21V3"/></svg>

      (e.muscles || []).some(m => m.toLowerCase().includes(q.toLowerCase()))

    const sorted = [...filtered].sort((a, b) => {

  function _muscleToGroup(name) {
    const m = (name || '').toLowerCase();
    if (m.includes('chest')    || m.includes('pectoral'))                          return 'chest';
    if (m.includes('middle back') || m.includes('lower back') ||
        m.includes('back')     || m.includes('lat')    || m.includes('rhomboid')) return 'back';
    if (m.includes('trap'))                                                         return 'traps';
    if (m.includes('shoulder') || m.includes('delt'))                              return 'shoulders';
    if (m.includes('bicep'))                                                        return 'biceps';
    if (m.includes('tricep'))                                                       return 'triceps';
    if (m.includes('forearm'))                                                      return 'forearms';
    if (m.includes('neck'))                                                         return 'neck';
    if (m.includes('abdom') || m.includes('obliq') || m.includes('core') ||
        m === 'abs' || m.includes(' abs'))                                          return 'abs';
    if (m.includes('glut'))                                                         return 'glutes';
    if (m.includes('quad')     || m.includes('thigh'))                             return 'quads';
    if (m.includes('hamstr')   || m.includes('ischio'))                            return 'hamstrings';
    if (m.includes('adduct'))                                                       return 'adductors';
    if (m.includes('abduct'))                                                       return 'abductors';
    if (m.includes('calf') || m.includes('calv') || m.includes('soleus') || m.includes('gastro')) return 'calves';
    return null;
  }

  // Named exercise intensity overrides: {group → opacity 0..1}
  const _NAMED_INTENSITIES = [
    { re: /hammer\s*curl|curl\s*marteau/i,      map: {biceps:1.0, forearms:0.7} },
    { re: /barbell\s*curl|curl\s*(barre|bar)/i, map: {biceps:1.0, forearms:0.6} },
    { re: /bench\s*press|développé\s*couché/i,  map: {chest:1.0, triceps:0.7, shoulders:0.5} },
    { re: /incline|incliné/i,                   map: {chest:1.0, shoulders:0.7, triceps:0.5} },
    { re: /squat/i,                              map: {quads:1.0, glutes:0.8, hamstrings:0.6} },
    { re: /deadlift|soulevé\s*de\s*terre/i,     map: {back:1.0, glutes:0.9, hamstrings:0.8, traps:0.5} },
    { re: /row|tirage/i,                         map: {back:1.0, biceps:0.7, traps:0.5} },
    { re: /pull.up|traction/i,                   map: {back:1.0, biceps:0.7} },
    { re: /shoulder\s*press|développé\s*épaule|overhead/i, map: {shoulders:1.0, triceps:0.7, traps:0.4} },
    { re: /lateral\s*raise|écarté\s*latéral/i,  map: {shoulders:1.0} },
    { re: /leg\s*press/i,                        map: {quads:1.0, glutes:0.7, hamstrings:0.5} },
    { re: /leg\s*curl/i,                         map: {hamstrings:1.0, calves:0.4} },
    { re: /leg\s*extension/i,                    map: {quads:1.0} },
    { re: /calf\s*raise|mollets/i,               map: {calves:1.0} },
    { re: /plank|gainage/i,                      map: {abs:1.0, back:0.6} },
    { re: /crunch|sit.up/i,                      map: {abs:1.0} },
  ];

  const _UPPER_GROUPS = new Set(['chest','shoulders','biceps','triceps','back','traps','forearms','abs','neck']);
  const _LOWER_GROUPS = new Set(['quads','hamstrings','glutes','calves','adductors','abductors']);

  function _getBodyRegion(muscles) {
    let up = false, lo = false;
    (muscles || []).forEach(m => {
      const g = _muscleToGroup(m);
      if (_UPPER_GROUPS.has(g)) up = true;
      if (_LOWER_GROUPS.has(g)) lo = true;
    });
    if (up && !lo) return 'upper';
    if (lo && !up) return 'lower';
    return 'full';
  }

  function _getIntensityMap(muscles, exerciseName) {
    // Named exercise overrides
    if (exerciseName) {
      for (const { re, map } of _NAMED_INTENSITIES) {
        if (re.test(exerciseName)) return { ...map };
      }
    }
    // Position-based fallback
    const result = {};
    (muscles || []).forEach((m, idx) => {
      const g = _muscleToGroup(m);
      if (g && !(g in result)) {
        result[g] = idx === 0 ? 1.0 : idx === 1 ? 0.7 : 0.4;
      }
    });
    return result;
  }

  function buildBodySvg(muscles, exerciseName) {
    const wrap = document.createElement('div');
    wrap.innerHTML = _BODY_SVG;
    const svg = wrap.firstElementChild;

    const intensityMap = _getIntensityMap(muscles, exerciseName);

    Object.entries(intensityMap).forEach(([group, intensity]) => {
      svg.querySelectorAll(`[data-group="${group}"]`).forEach(el => {
        // ≥0.5 → orange scale; <0.5 → light orange
        el.style.fill         = intensity >= 0.5 ? '#F97316' : '#FED7AA';
        el.style.fillOpacity  = String(intensity);
        el.style.stroke       = intensity >= 0.5 ? '#EA580C' : '#FDBA74';
        el.style.strokeOpacity = '0.8';
      });
    });

    // Intelligent crop based on body region
    const region = _getBodyRegion(muscles);
    if (region === 'upper') {
      svg.setAttribute('viewBox', '0 0 220 115');
      svg.style.maxHeight = '140px';
    } else if (region === 'lower') {
      svg.setAttribute('viewBox', '0 110 220 158');
      svg.style.maxHeight = '160px';
    }

    return svg;
  }

  // ── Exercise info modal ───────────────────────────────────────────────────────
  document.getElementById('closeInfo').addEventListener('click', closeInfoModal);
  document.getElementById('infoBackdrop').addEventListener('click', closeInfoModal);

  async function openInfoModal(exerciseId) {
    // Show modal with skeleton state
    document.getElementById('infoModal').classList.remove('hidden');
    document.getElementById('infoName').textContent = '…';
    document.getElementById('infoMuscles').innerHTML = '';
    document.getElementById('infoBodySvg').innerHTML = '';
    document.getElementById('infoImgSection').innerHTML =
      '<div class="w-full h-40 bg-gray-800 rounded-xl animate-pulse"></div>';
    document.getElementById('infoRecordWrap').classList.add('hidden');
    document.getElementById('infoInstructionsWrap').classList.add('hidden');
    document.getElementById('infoTip').innerHTML =
      '<span class="text-gray-600 text-sm">Chargement…</span>';

    try {
      const ex = await api.getExercise(exerciseId);
      console.log('[infoModal] exercise object from API:', ex);
      console.log('[infoModal] image_url field:', ex.image_url);
      document.getElementById('infoName').textContent = ex.name;

      // ── Image ──────────────────────────────────────────────────────────────
      const imgSec = document.getElementById('infoImgSection');
      const imgUrl = ex.image_url || null;
      console.log('[img] image_url from API:', imgUrl);

      // Fetch test: reveals 404 / CORS / CSP independently of <img> loading
      if (imgUrl) {
        fetch(imgUrl, { method: 'HEAD', mode: 'no-cors' })
          .then(() => console.log('[img] fetch HEAD no-cors: request sent (opaque — no status visible)'))
          .catch(e => console.error('[img] fetch HEAD error (likely CORS/CSP block):', e));
        // Also try a real GET to read the status
        fetch(imgUrl)
          .then(r  => console.log('[img] fetch GET status:', r.status, r.ok ? 'OK' : 'FAIL', imgUrl))
          .catch(e => console.error('[img] fetch GET blocked (CORS/CSP/network):', e.message, imgUrl));
      }

      if (imgUrl) {
        const img = new Image();
        img.alt   = ex.name;
        img.style.cssText = 'width:100%;border-radius:12px;display:block';
        img.onload = () => console.log('[img] <img> loaded OK:', imgUrl);
        img.onerror = (ev) => {
          console.error('[img] <img> onerror —',
            'type:', ev.type,
            '| src:', ev.target.src,
            '| naturalW:', ev.target.naturalWidth,
            '| full url:', imgUrl,
          );
          imgSec.innerHTML = _imgPlaceholder();
        };
        imgSec.innerHTML = '';
        imgSec.appendChild(img);
        img.src = imgUrl;
      } else {
        console.log('[img] no image_url → placeholder');
        imgSec.innerHTML = _imgPlaceholder();
      }

      // ── Muscles + SVG body ─────────────────────────────────────────────────
      document.getElementById('infoMuscles').innerHTML =
        (ex.muscles || []).map(m => muscleBadge(m)).join('');
      document.getElementById('infoBodySvg').appendChild(
        buildBodySvg(ex.muscles, ex.name)
      );

      // ── Instructions ───────────────────────────────────────────────────────
      if (ex.instructions) {
        const steps = ex.instructions.split('\n').filter(Boolean);
        document.getElementById('infoInstructions').innerHTML = steps.map((s, i) => {
          const text = s.replace(/^\d+\.\s*/, '');
          return `<div class="flex gap-3 items-start">
            <span class="w-6 h-6 rounded-full bg-orange-500/20 text-orange-400 text-xs font-bold flex items-center justify-center flex-shrink-0 mt-0.5">${i+1}</span>
            <span class="text-gray-300 text-sm leading-snug">${escapeHtml(text)}</span>
          </div>`;
        }).join('');
        document.getElementById('infoInstructionsWrap').classList.remove('hidden');
      }

      // ── Personal record + tip (async, parallel) ────────────────────────────
      const [hist, tipResp] = await Promise.allSettled([
        api.getExerciseHistory(exerciseId, 20),
        api.getExerciseTip(exerciseId),
      ]);

      if (hist.status === 'fulfilled' && hist.value.length) {
        const allSets = hist.value.flatMap(h => h.sets || []);
        if (allSets.length) {
          const maxW = Math.max(...allSets.map(s => s.weight_kg));
          const maxR = Math.max(...allSets.filter(s => s.weight_kg === maxW).map(s => s.reps));
          document.getElementById('infoRecord').textContent = `${maxW} kg × ${maxR} reps`;
          document.getElementById('infoRecordWrap').classList.remove('hidden');
        }
      }

      document.getElementById('infoTip').innerHTML = tipResp.status === 'fulfilled'
        ? `<p class="text-gray-300">${escapeHtml(tipResp.value.tip)}</p>`
        : `<p class="text-gray-600 text-sm">Complète une séance pour obtenir des conseils personnalisés.</p>`;

    } catch {
      document.getElementById('infoName').textContent = 'Erreur de chargement';
    }
  }

  function _imgPlaceholder() {
    return `<div class="w-full h-36 bg-gray-800 rounded-xl flex items-center justify-center gap-2 text-gray-600">
      <svg class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6.827 6.175A2.31 2.31 0 0 1 5.186 7.23c-.38.054-.757.112-1.134.175C2.999 7.58 2.25 8.507 2.25 9.574V18a2.25 2.25 0 0 0 2.25 2.25h15A2.25 2.25 0 0 0 21.75 18V9.574c0-1.067-.75-1.994-1.802-2.169a47.865 47.865 0 0 0-1.134-.175 2.31 2.31 0 0 1-1.64-1.055l-.822-1.316a2.192 2.192 0 0 0-1.736-1.039 48.774 48.774 0 0 0-5.232 0 2.192 2.192 0 0 0-1.736 1.039l-.821 1.316Z"/>
        <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 12.75a4.5 4.5 0 1 1-9 0 4.5 4.5 0 0 1 9 0Z"/>
      </svg>
      <span class="text-sm font-medium">Pas d'image disponible</span>
    </div>`;
  }

  function closeInfoModal() {
    document.getElementById('infoModal').classList.add('hidden');
  }

  init();
  </script>
</body>
