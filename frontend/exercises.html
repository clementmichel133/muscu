<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercices — Muscu</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Barlow', sans-serif; background: #030712; }
    .heading { font-family: 'Barlow Condensed', sans-serif; letter-spacing: 0.04em; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body class="min-h-screen text-gray-100 pb-24">

  <header class="px-4 pt-8 pb-4">
    <h1 class="text-3xl font-bold text-orange-500 uppercase heading">Exercices</h1>
    <p class="text-gray-400 text-sm" id="exerciseCount"></p>
  </header>

  <main class="px-4" id="exerciseList">
    <p class="text-gray-500 text-center py-8">Chargement…</p>
  </main>

  <!-- FAB -->
  <button id="fabBtn"
    class="fixed bottom-20 right-4 w-14 h-14 bg-orange-500 hover:bg-orange-400 rounded-full flex items-center justify-center shadow-lg z-40 cursor-pointer transition-colors duration-200"
    aria-label="Ajouter un exercice">
    <svg class="w-7 h-7 text-white" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
    </svg>
  </button>

  <!-- Modal -->
  <div id="modal" class="hidden fixed inset-0 bg-black/70 z-50 flex items-end" role="dialog" aria-modal="true" aria-label="Ajouter un exercice">
    <div class="bg-gray-900 border-t border-gray-700 rounded-t-2xl w-full max-h-[88vh] overflow-y-auto p-5">

      <div class="flex items-center justify-between mb-5">
        <h2 class="text-xl font-bold heading uppercase">Ajouter un exercice</h2>
        <button id="closeModal" class="text-gray-400 hover:text-white cursor-pointer transition-colors duration-200" aria-label="Fermer">
          <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <!-- Tabs -->
      <div class="flex gap-2 mb-5">
        <button id="tabManuel" onclick="switchTab('manuel')"
          class="flex-1 py-2.5 rounded-xl text-sm font-semibold uppercase cursor-pointer transition-colors duration-200 bg-orange-500 text-white">
          Manuel
        </button>
        <button id="tabPhoto" onclick="switchTab('photo')"
          class="flex-1 py-2.5 rounded-xl text-sm font-semibold uppercase cursor-pointer transition-colors duration-200 bg-gray-700 text-gray-300 hover:bg-gray-600">
          Photo
        </button>
      </div>

      <!-- Panel : Manuel -->
      <div id="panelManuel" class="space-y-4">
        <div>
          <label for="manualName" class="block text-xs uppercase tracking-widest text-gray-400 mb-1 font-semibold">Nom *</label>
          <input type="text" id="manualName" placeholder="Ex : Développé couché" autocomplete="off"
            class="w-full bg-gray-800 border border-gray-700 text-gray-100 text-base rounded-xl px-4 py-3 focus:outline-none focus:border-orange-500 min-h-[52px]">
        </div>
        <div>
          <label for="manualDesc" class="block text-xs uppercase tracking-widest text-gray-400 mb-1 font-semibold">Description</label>
          <textarea id="manualDesc" rows="2" placeholder="Ex : Prise large, descente lente 3s…"
            class="w-full bg-gray-800 border border-gray-700 text-gray-100 text-base rounded-xl px-4 py-3 focus:outline-none focus:border-orange-500 resize-none"></textarea>
        </div>
        <button id="manualSubmit"
          class="w-full bg-green-500 hover:bg-green-400 text-white text-lg font-bold uppercase heading rounded-xl py-4 transition-colors duration-200 cursor-pointer min-h-[56px] disabled:opacity-60">
          Ajouter
        </button>
      </div>

      <!-- Panel : Photo -->
      <div id="panelPhoto" class="hidden space-y-4">

        <input type="file" id="photoInput" accept="image/*" capture="environment" class="hidden" aria-label="Choisir une photo">

        <button id="photoBtn" onclick="document.getElementById('photoInput').click()"
          class="w-full border-2 border-dashed border-gray-600 hover:border-orange-500 rounded-xl py-8 flex flex-col items-center gap-2 text-gray-400 hover:text-orange-400 cursor-pointer transition-colors duration-200">
          <svg class="w-10 h-10" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6.827 6.175A2.31 2.31 0 0 1 5.186 7.23c-.38.054-.757.112-1.134.175C2.999 7.58 2.25 8.507 2.25 9.574V18a2.25 2.25 0 0 0 2.25 2.25h15A2.25 2.25 0 0 0 21.75 18V9.574c0-1.067-.75-1.994-1.802-2.169a47.865 47.865 0 0 0-1.134-.175 2.31 2.31 0 0 1-1.64-1.055l-.822-1.316a2.192 2.192 0 0 0-1.736-1.039 48.774 48.774 0 0 0-5.232 0 2.192 2.192 0 0 0-1.736 1.039l-.821 1.316Z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 12.75a4.5 4.5 0 1 1-9 0 4.5 4.5 0 0 1 9 0ZM18.75 10.5h.008v.008h-.008V10.5Z" />
          </svg>
          <span class="text-sm font-semibold">Prendre une photo</span>
        </button>

        <!-- Aperçu + bouton Analyser -->
        <div id="photoPreviewDiv" class="hidden space-y-3">
          <img id="photoPreview" class="w-full rounded-xl object-cover max-h-52" alt="Aperçu de la machine">
          <button id="analyzeBtn"
            class="w-full bg-orange-500 hover:bg-orange-400 text-white text-lg font-bold uppercase heading rounded-xl py-4 transition-colors duration-200 cursor-pointer min-h-[56px] disabled:opacity-60">
            Analyser avec Claude
          </button>
        </div>

        <!-- Résultat de la détection -->
        <div id="detectResult" class="hidden space-y-4 border-t border-gray-700 pt-4">
          <div>
            <label for="detectedName" class="block text-xs uppercase tracking-widest text-gray-400 mb-1 font-semibold">Nom détecté</label>
            <input type="text" id="detectedName"
              class="w-full bg-gray-800 border border-gray-700 text-gray-100 text-base rounded-xl px-4 py-3 focus:outline-none focus:border-orange-500 min-h-[52px]">
          </div>
          <div>
            <p class="text-xs uppercase tracking-widest text-gray-400 mb-2 font-semibold">Muscles</p>
            <div id="detectedMuscles" class="flex flex-wrap gap-2"></div>
          </div>
          <div>
            <p class="text-xs uppercase tracking-widest text-gray-400 mb-1 font-semibold">Conseil</p>
            <p id="detectedTips" class="text-gray-300 text-sm bg-gray-800 rounded-xl px-4 py-3"></p>
          </div>
          <button id="confirmDetect"
            class="w-full bg-green-500 hover:bg-green-400 text-white text-lg font-bold uppercase heading rounded-xl py-4 transition-colors duration-200 cursor-pointer min-h-[56px] disabled:opacity-60">
            Confirmer et ajouter
          </button>
        </div>

      </div>
    </div>
  </div>

  <nav class="fixed bottom-0 left-0 right-0 bg-gray-900 border-t border-gray-800 z-50">
    <div class="grid grid-cols-4 h-16">
      <a href="index.html" class="flex flex-col items-center justify-center gap-1 text-xs font-semibold text-gray-500 hover:text-gray-300 transition-colors duration-200 cursor-pointer">
        <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931Zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0 1 15.75 21H5.25A2.25 2.25 0 0 1 3 18.75V8.25A2.25 2.25 0 0 1 5.25 6H10" />
        </svg>
        Séance
      </a>
      <a href="exercises.html" class="flex flex-col items-center justify-center gap-1 text-xs font-semibold text-orange-500 cursor-pointer" aria-current="page">
        <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 6.75h12M8.25 12h12m-12 5.25h12M3.75 6.75h.007v.008H3.75V6.75Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0ZM3.75 12h.007v.008H3.75V12Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm-.375 5.25h.007v.008H3.75v-.008Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z" />
        </svg>
        Exercices
      </a>
      <a href="history.html" class="flex flex-col items-center justify-center gap-1 text-xs font-semibold text-gray-500 hover:text-gray-300 transition-colors duration-200 cursor-pointer">
        <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 0 1 3 19.875v-6.75ZM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V8.625ZM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V4.125Z" />
        </svg>
        Historique
      </a>
      <a href="weekly.html" class="flex flex-col items-center justify-center gap-1 text-xs font-semibold text-gray-500 hover:text-gray-300 transition-colors duration-200 cursor-pointer">
        <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75m-18 0v-7.5A2.25 2.25 0 0 1 5.25 9h13.5A2.25 2.25 0 0 1 21 9v7.5m-9-6h.008v.008H12V9Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0ZM12 12h.008v.008H12V12Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0ZM9.75 12h.008v.008H9.75V12Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z" />
        </svg>
        Semaine
      </a>
    </div>
  </nav>

  <script src="app.js"></script>
  <script>
    let exercises = [];
    let detectedData = null;
    let currentPhotoBase64 = null;

    async function loadExercises() {
      try {
        exercises = await api.getExercises();
        renderList();
      } catch {
        document.getElementById('exerciseList').innerHTML =
          '<p class="text-red-400 text-center py-8">Impossible de charger les exercices</p>';
      }
    }

    function renderList() {
      const count = exercises.length;
      document.getElementById('exerciseCount').textContent =
        `${count} exercice${count !== 1 ? 's' : ''}`;

      const container = document.getElementById('exerciseList');
      if (!count) {
        container.innerHTML = '<p class="text-gray-500 text-center py-10">Aucun exercice — appuyez sur + pour en ajouter un !</p>';
        return;
      }
      container.innerHTML = exercises.map(ex => `
        <div class="bg-gray-800 border border-gray-700 rounded-xl p-4 mb-3">
          <h3 class="text-base font-semibold text-gray-100">${escapeHtml(ex.name)}</h3>
          ${ex.description ? `<p class="text-gray-400 text-sm mt-1">${escapeHtml(ex.description)}</p>` : ''}
          ${ex.muscles && ex.muscles.length ? `
            <div class="flex flex-wrap gap-2 mt-2">
              ${ex.muscles.map(m => `<span class="text-xs bg-orange-500/20 text-orange-300 px-2 py-0.5 rounded-full">${escapeHtml(m)}</span>`).join('')}
            </div>` : ''}
        </div>
      `).join('');
    }

    // Modal
    document.getElementById('fabBtn').addEventListener('click', () => {
      document.getElementById('modal').classList.remove('hidden');
    });
    document.getElementById('closeModal').addEventListener('click', closeModal);
    document.getElementById('modal').addEventListener('click', e => {
      if (e.target === document.getElementById('modal')) closeModal();
    });

    function closeModal() {
      document.getElementById('modal').classList.add('hidden');
      document.getElementById('manualName').value = '';
      document.getElementById('manualDesc').value = '';
      document.getElementById('photoInput').value = '';
      document.getElementById('photoPreviewDiv').classList.add('hidden');
      document.getElementById('detectResult').classList.add('hidden');
      currentPhotoBase64 = null;
      detectedData = null;
      switchTab('manuel');
    }

    function switchTab(tab) {
      const isManuel = tab === 'manuel';
      document.getElementById('panelManuel').classList.toggle('hidden', !isManuel);
      document.getElementById('panelPhoto').classList.toggle('hidden', isManuel);
      const active = 'bg-orange-500 text-white';
      const inactive = 'bg-gray-700 text-gray-300 hover:bg-gray-600';
      document.getElementById('tabManuel').className = `flex-1 py-2.5 rounded-xl text-sm font-semibold uppercase cursor-pointer transition-colors duration-200 ${isManuel ? active : inactive}`;
      document.getElementById('tabPhoto').className = `flex-1 py-2.5 rounded-xl text-sm font-semibold uppercase cursor-pointer transition-colors duration-200 ${!isManuel ? active : inactive}`;
    }

    // Manuel submit
    document.getElementById('manualSubmit').addEventListener('click', async () => {
      const btn = document.getElementById('manualSubmit');
      const name = document.getElementById('manualName').value.trim();
      if (!name) return showToast('Nom requis', 'error');

      setLoading(btn, true);
      try {
        await api.createExercise({
          name,
          description: document.getElementById('manualDesc').value.trim() || null,
        });
        showToast('Exercice ajouté !');
        closeModal();
        loadExercises();
      } catch (e) {
        showToast(e.message, 'error');
      } finally {
        setLoading(btn, false);
      }
    });

    // Photo : sélection fichier
    document.getElementById('photoInput').addEventListener('change', function () {
      const file = this.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        currentPhotoBase64 = e.target.result;
        document.getElementById('photoPreview').src = currentPhotoBase64;
        document.getElementById('photoPreviewDiv').classList.remove('hidden');
        document.getElementById('detectResult').classList.add('hidden');
      };
      reader.readAsDataURL(file);
    });

    // Photo : analyser
    document.getElementById('analyzeBtn').addEventListener('click', async () => {
      const btn = document.getElementById('analyzeBtn');
      if (!currentPhotoBase64) return;

      setLoading(btn, true);
      try {
        const result = await api.detectMachine(currentPhotoBase64);
        detectedData = result;
        document.getElementById('detectedName').value = result.name;
        document.getElementById('detectedMuscles').innerHTML = result.muscles.map(m =>
          `<span class="text-xs bg-orange-500/20 text-orange-300 px-2 py-1 rounded-full">${escapeHtml(m)}</span>`
        ).join('');
        document.getElementById('detectedTips').textContent = result.tips;
        document.getElementById('detectResult').classList.remove('hidden');
      } catch (e) {
        showToast(e.message, 'error');
      } finally {
        setLoading(btn, false);
      }
    });

    // Photo : confirmer
    document.getElementById('confirmDetect').addEventListener('click', async () => {
      const btn = document.getElementById('confirmDetect');
      if (!detectedData) return;

      setLoading(btn, true);
      try {
        await api.createExercise({
          name: document.getElementById('detectedName').value.trim(),
          muscles: detectedData.muscles,
          description: detectedData.tips,
        });
        showToast('Exercice ajouté !');
        closeModal();
        loadExercises();
      } catch (e) {
        showToast(e.message, 'error');
      } finally {
        setLoading(btn, false);
      }
    });

    loadExercises();
  </script>
</body>
</html>
